<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich dark charcoal/gold tint -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B38728" />
      <stop offset="25%" stop-color="#FBF5B7" />
      <stop offset="50%" stop-color="#DAA520" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular dark background with gold stroke -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Centered emblem containing 'A' and scissor silhouette -->
  <g transform="translate(256, 256) scale(0.9)" filter="url(#glow)">
    <!-- Elegant golden monogram letter 'A' integrated with styling waves -->
    <!-- Left Leg -->
    <path d="M -70 140 L -25 -100 L 0 -100 L -30 140 Z" fill="url(#goldGrad)"/>
    <!-- Right Leg curve (stylized hair strand/wave flowing down) -->
    <path d="M -5 -100 C 30 -100, 50 -60, 60 -20 C 75 40, 120 100, 140 120 C 90 100, 50 40, 30 -20 C 20 -50, 10 -100, -5 -100 Z" fill="url(#goldGrad)"/>
    <!-- Central Crossbar (Scissors shape) -->
    <path d="M -110 50 C -110 20, -80 20, -70 40 L 70 -60 C 80 -70, 110 -70, 110 -40 C 110 -10, 80 -10, 70 -20 L -70 80 C -80 90, -110 90, -110 50 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="-90" cy="50" r="15" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="90" cy="-50" r="15" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  </g>
</svg>
